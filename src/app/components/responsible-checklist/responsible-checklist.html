<section class="checklist" aria-labelledby="checklist-title"><div class="checklist-heading"><div><p class="eyebrow">Pause before publishing</p><h2 id="checklist-title">Before using an AI-generated output</h2></div><strong>{{ completedCount() }} / {{ checks.length }}</strong></div><div class="checklist-items">@for (check of checks; track check; let index = $index) { <label class="check-item" [class.is-complete]="completed().has(index)"><input type="checkbox" [checked]="completed().has(index)" (change)="toggle(index)" /><span>{{ check }}</span></label> }</div><p class="completion" aria-live="polite">Responsible-use checks completed: {{ completedCount() }} / {{ checks.length }}</p></section>
